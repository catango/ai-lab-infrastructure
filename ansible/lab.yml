# The lab profile (CR-57, ADR-012 decision 5, PA-16): the AI lab, Debian 13, x86-64. The CR-2 `builder` profile became this one.
# Run by the lab admin from a clone the admin owns, at a release tag (the first pre-task refuses anything else; nothing skips it).
# The names of the two managed accounts are not in the repository: pass them as -e lab_ai_user=<name> -e lab_admin_user=<name>.
#   Dry run (default):  ansible-playbook -i ansible/inventory/localhost.yml ansible/lab.yml --check --diff -e lab_ai_user=... -e lab_admin_user=...
#   Apply:              the same without --check, with -e lab_apply=true
#   Switch sshd:        only after a second login with each account worked while this session stayed open, add
#                       -e ssh_second_login_confirmed=true. Without it everything else is applied and sshd keeps its settings.
# Order: the gates and the key audit first (a refusal changes nothing), the toolchain, the managed files, the root-owned token step
# and lab check, the user-level deny layer (lab_deny_layer; the one write into the AI user's home), the system-wide git identity (LC-8)
# and unattended security updates (LC-15) next, sshd last.
- name: Apply the lab profile
  hosts: all
  connection: local
  gather_facts: true
  vars:
    toolchain_profile: lab
    ssh_hardening_accounts: ["{{ lab_ai_user | default('') }}", "{{ lab_admin_user | default('') }}"]
    ssh_hardening_private_key_accounts: ["{{ lab_ai_user | default('') }}"]
    ssh_hardening_key_options:
      - account: "{{ lab_ai_user | default('') }}"
        options: "restrict,pty"
  pre_tasks:
    - name: Refuse a real run without the explicit apply variable
      tags: [always]
      ansible.builtin.assert:
        that:
          - ansible_check_mode or (lab_apply | bool)
        quiet: true
        fail_msg: >-
          the lab profile changes this machine, so a real run needs -e lab_apply=true; use --check --diff for a dry run

    - name: Release check, lab setup runs only at a release tag
      tags: [always]
      ansible.builtin.import_role:
        name: release_check

    - name: Preflight, the lab profile supports one platform only
      tags: [preflight]
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == lab_expected_os
          - ansible_facts['distribution_major_version'] == lab_expected_major
          - ansible_facts['architecture'] == lab_expected_arch
        quiet: true
        fail_msg: >-
          lab profile requires {{ lab_expected_os }} {{ lab_expected_major }} on {{ lab_expected_arch }}
          (found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}
          on {{ ansible_facts['architecture'] }})

    - name: The two managed accounts are named and differ
      tags: [always]
      ansible.builtin.assert:
        that:
          - lab_ai_user is defined
          - lab_admin_user is defined
          - lab_ai_user is match('^[a-z_][a-z0-9_-]{0,31}$')
          - lab_admin_user is match('^[a-z_][a-z0-9_-]{0,31}$')
          - lab_ai_user != lab_admin_user
          - lab_ai_user != 'root'
          - lab_admin_user != 'root'
        quiet: true
        fail_msg: >-
          name the two managed accounts with -e lab_ai_user=<name> -e lab_admin_user=<name>: plain, different, and neither is root

    - name: Key audit, one key per managed account and no other key on the machine (PA-16); refuses before anything changes
      tags: [always]
      ansible.builtin.import_role:
        name: ssh_hardening
        tasks_from: audit

    - name: The configuration names the machine account and its numeric id, for the system-wide git identity (LC-8); refuses before anything changes
      tags: [always]
      ansible.builtin.import_role:
        name: git_identity
        tasks_from: assert

    - name: Deny layer variable, lab_deny_layer must name one of the three modes
      tags: [always]
      ansible.builtin.assert:
        that:
          - lab_deny_layer in ['both', 'user', 'managed']
        quiet: true
        fail_msg: >-
          lab_deny_layer must be both, user, or managed (the default is both)

    # Plan PR 8 (PA-34, I-7): reads the project the lab admin named (merged commit or tag, or a SHA of the AI user's clone) and merges
    # its deny.platform.txt entries into the lab-wide list. It changes nothing on the machine; a refusal stops the play here.
    - name: Project input, the project's package list, manifest, and deny entries are read and checked (changes nothing)
      tags: [always]
      ansible.builtin.import_role:
        name: lab_project
        tasks_from: input

    # PA-51: the last pre-task. It changes nothing: it tries the immutable attribute on a scratch file next to the AI user's home, so a
    # filesystem or a container without it fails the play before any file is written. The PA-28 fixtures skip it by this tag to show the
    # refusals of the module and its fail-closed path; nothing else does.
    - name: Attribute probe, the home of the AI user takes the immutable attribute (PA-51) and nothing is changed
      tags: [always, claude_user_deny_probe]
      ansible.builtin.import_role:
        name: claude_user_deny
        tasks_from: probe
      when: lab_deny_layer in ['both', 'user']

  roles:
    - apt_base
    - toolchain
    - python_tools
    - shell_env
    - verify
    - role: claude_managed_settings
      tags: [claude_managed_settings]
    - role: lab_tools
      tags: [lab_tools]
    - role: lab_project
      tags: [lab_project]
    - role: claude_user_deny
      tags: [claude_user_deny]
    - role: git_identity
      tags: [git_identity]
    - role: unattended_upgrades
      tags: [unattended_upgrades]
    - role: ssh_hardening
      tags: [ssh_hardening]

  post_tasks:
    - name: Remove the staged project files
      tags: [always]
      ansible.builtin.file:
        path: "{{ lab_project_stage }}"
        state: absent
      when: lab_project_stage is defined
      check_mode: false
      become: "{{ ai_lab_become }}"
