# Key-only SSH from a drop-in that sorts before the cloud image's own files (the first value of a keyword wins).
- name: The drop-in directory and the privilege-separation directory exist (sshd -t needs both)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/ssh/sshd_config.d
    - /run/sshd
  become: "{{ ai_lab_become }}"

- name: Key-only SSH, no root login, no forwarding
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-operator.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      # Managed by ai-lab-infrastructure (operator_ssh). Do not edit.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowAgentForwarding no
      MaxAuthTries 3
  notify: Reload ssh
  become: "{{ ai_lab_become }}"
