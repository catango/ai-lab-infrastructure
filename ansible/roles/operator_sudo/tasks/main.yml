# Sudo asks for the password every time, on both operator machines (Q9). No rule that skips the password is ever written, and
# an option that does is removed from the other files in /etc/sudoers.d (for example the one cloud-init writes for the first account).
- name: Sudo for the operator, with a password, and no cached password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-operator
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      # Managed by ai-lab-infrastructure (operator_sudo). Do not edit.
      Defaults timestamp_timeout=0
      {{ operator_user_name }} ALL=(ALL:ALL) ALL
  become: "{{ ai_lab_become }}"

- name: Find other sudoers files that skip the password
  ansible.builtin.find:
    paths: /etc/sudoers.d
    patterns: ["*"]
    contains: '^[^#]*NOPASSWD'
  register: operator_nopasswd_files
  become: "{{ ai_lab_become }}"

- name: Remove that option from them
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: 'NOPASSWD:\s*'
    replace: ''
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ operator_nopasswd_files.files | map(attribute='path') | reject('equalto', '/etc/sudoers.d/90-operator') | list }}"
  become: "{{ ai_lab_become }}"
