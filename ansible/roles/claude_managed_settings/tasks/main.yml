# Opt-in (claude_managed_settings_enabled: false by default; design 3.6 and decision 5).
# Writes /etc/claude-code/managed-settings.json from the repository's .claude/settings.json deny rules.
# Never replaces a file this role did not write: an existing foreign file stops the play (merge by hand).
- name: Managed settings (opt-in)
  when: claude_managed_settings_enabled | bool
  vars:
    managed_settings_path: /etc/claude-code/managed-settings.json
    managed_settings_marker: ai-lab-infrastructure
    repo_settings: "{{ lookup('ansible.builtin.file', repo_root + '/.claude/settings.json') | from_json }}"
  block:
    - name: Look for an existing managed settings file
      ansible.builtin.stat:
        path: "{{ managed_settings_path }}"
      register: managed_settings_stat

    - name: Read it when it exists
      ansible.builtin.slurp:
        src: "{{ managed_settings_path }}"
      register: managed_settings_current
      when: managed_settings_stat.stat.exists

    - name: Refuse to replace a file this role did not write
      ansible.builtin.assert:
        that:
          - (managed_settings_current.content | b64decode | from_json)['_managed_by'] | default('') == managed_settings_marker
        quiet: true
        fail_msg: "{{ managed_settings_path }} exists and is not managed by this repository; merge it by hand (refusing to replace it)"
      when: managed_settings_stat.stat.exists

    - name: Create the directory
      ansible.builtin.file:
        path: /etc/claude-code
        state: directory
        mode: "0755"
      become: "{{ ai_lab_become }}"

    - name: Write the managed settings
      ansible.builtin.copy:
        dest: "{{ managed_settings_path }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ {'_managed_by': managed_settings_marker, 'permissions': {'disableBypassPermissionsMode': 'disable', 'deny': repo_settings['permissions']['deny']}} | to_nice_json }}\n"
      become: "{{ ai_lab_become }}"
