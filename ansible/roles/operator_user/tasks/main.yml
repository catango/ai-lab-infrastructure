# The operator accounts (CR-57 OC-8, ADR-012 decision 7): both exist, and the operator user has no sudo. The accounts are provisioned
# with the machine, so this role creates none and writes nothing into a home directory (no mode change, no .ssh): keys are the business
# of the shared SSH hardening role. Sudo for the operator user is not granted anywhere: the operator admin holds it.
- name: Both managed accounts exist
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
  loop: ["{{ operator_user }}", "{{ operator_admin_user }}"]

- name: Read the groups of the operator user
  ansible.builtin.command:
    argv: [id, -nG, "{{ operator_user }}"]
  register: operator_user_groups
  changed_when: false
  check_mode: false

- name: Take the operator user out of every root-equivalent group
  ansible.builtin.command:
    argv: [gpasswd, -d, "{{ operator_user }}", "{{ item }}"]
  loop: "{{ operator_user_privileged_groups | intersect(operator_user_groups.stdout.split()) }}"
  become: "{{ ai_lab_become }}"

- name: No sudoers rule names the operator user (it is for the operator admin to remove, not edited here)
  ansible.builtin.command:
    argv: [grep, -rEls, '^[^#]*(^|[[:space:]])({{ operator_user | regex_escape }})([[:space:]]|$)', /etc/sudoers, /etc/sudoers.d]
  register: operator_user_sudoers
  changed_when: false
  failed_when: operator_user_sudoers.rc == 0
  check_mode: false
  become: "{{ ai_lab_become }}"
