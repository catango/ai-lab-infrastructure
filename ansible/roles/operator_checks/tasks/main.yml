# The operator configuration ends by running the operator check as the operator user (ADR-012 decision 7). The check is read-only. Its
# output is shown as printed. A failure stops the run once sshd has been switched (-e ssh_second_login_confirmed=true), because then every
# item must hold; before that OC-10 cannot hold yet, so the run goes on and says so. A dry run installs nothing, so there is nothing to run.
- name: Run the operator check as the operator user
  ansible.builtin.command:
    argv: [/usr/sbin/runuser, -u, "{{ operator_user }}", --, "{{ operator_tools_dir }}/operator-check"]
  register: operator_checks_result
  changed_when: false
  failed_when: false
  check_mode: false
  when: not ansible_check_mode
  become: "{{ ai_lab_become }}"

- name: The operator check, as printed
  ansible.builtin.debug:
    msg: "{{ (operator_checks_result.stdout_lines | default([])) + (operator_checks_result.stderr_lines | default([])) }}"
  when: not ansible_check_mode

- name: The operator check must pass once sshd is switched
  ansible.builtin.assert:
    that:
      - operator_checks_result.rc == 0
    quiet: true
    fail_msg: the operator check failed after sshd was switched; read its output above (item ids and rules only)
  when: not ansible_check_mode and (ssh_second_login_confirmed | bool)
