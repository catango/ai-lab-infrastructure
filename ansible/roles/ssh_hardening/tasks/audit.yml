# The audit half of the shared SSH hardening role (PA-16, PA-31). It only reads, so it also runs in check mode, and the profile
# imports it as a pre-task: a refusal here happens before the toolchain, the managed files, or sshd are touched.
- name: Audit the provisioned keys (one per managed account, none shared, none for any other account, no private key where listed)
  ssh_hardening_audit:
    mode: keys
    accounts: "{{ ssh_hardening_accounts }}"
    private_key_accounts: "{{ ssh_hardening_private_key_accounts }}"
    keys_dir: "{{ ssh_hardening_keys_dir }}"
  check_mode: false
  become: "{{ ai_lab_become }}"

- name: Read the effective sshd settings (sshd -T reads the files; it needs no running daemon)
  ansible.builtin.command:
    argv: ["{{ ssh_hardening_sshd }}", -T]
  register: ssh_hardening_sshd_before
  changed_when: false
  check_mode: false
  become: "{{ ai_lab_become }}"

- name: Audit sshd (AuthorizedKeysCommand, TrustedUserCAKeys, and AuthorizedPrincipalsFile must be unset)
  ssh_hardening_audit:
    mode: sshd_before
    sshd_text: "{{ ssh_hardening_sshd_before.stdout }}"
    keys_dir: "{{ ssh_hardening_keys_dir }}"
  check_mode: false
