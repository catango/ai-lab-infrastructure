# The one defaults file of the shared SSH hardening role (design PA-31, PA-A27). The lab profile and the operator profile include
# this role by this name and set only the accounts below; they do not copy the sshd settings.

# The managed accounts: exactly one provisioned key each. Set by the profile (the names are not in the repository).
ssh_hardening_accounts: []
# Managed accounts whose ~/.ssh must hold no private key (the AI user on a lab, the operator user on the operator machine).
ssh_hardening_private_key_accounts: []
# Options placed in front of the key of an account in the root-owned location: [{account: <name>, options: "restrict,pty"}].
ssh_hardening_key_options: []

# The root-owned location sshd reads keys from after the switch: one file per account, owned by root.
ssh_hardening_keys_dir: /etc/ssh/authorized_keys
# The drop-in sorts before the files of the cloud images (the first value of a keyword wins).
ssh_hardening_dropin: /etc/ssh/sshd_config.d/00-ai-lab.conf
ssh_hardening_sshd: /usr/sbin/sshd
# What `sshd -T` showed once the drop-in was in force, with the digest of the configuration files it came from. `sshd -T` needs root,
# so the read-only checks that run as an ordinary user (the lab check) read this file instead and fail when the digest no longer matches.
ssh_hardening_snapshot: /etc/ssh/ai-lab-sshd-effective.txt

# A copy of the drop-in as sshd last loaded it, made after a successful reload. The next run reloads when the drop-in differs from it
# or it is missing, so a drop-in that was written by a run that then failed is still loaded by the next run.
ssh_hardening_loaded: /etc/ssh/ai-lab-sshd-loaded.txt

# sshd is switched only after a second login with each managed account worked while the current session stayed open (PA-16).
ssh_second_login_confirmed: false
