# Locks SSH access for the provider's initial account. Only after an operator login was confirmed from a second session.
- name: Refuse unless the approver confirmed an operator login and named the initial account
  ansible.builtin.assert:
    that:
      - operator_login_confirmed is defined
      - operator_login_confirmed | bool
      - operator_initial_account is defined
      - operator_initial_account is match('^[a-z_][a-z0-9_-]{0,31}$')
      - operator_initial_account != operator_user_name
      - operator_initial_account != 'root'
    quiet: true
    fail_msg: >-
      the lock needs -e operator_login_confirmed=true (after logging in as the operator from a second session) and
      -e operator_initial_account=<the provider's initial account>, which must differ from the operator account

- name: The operator has a key installed
  ansible.builtin.stat:
    path: "/home/{{ operator_user_name }}/.ssh/authorized_keys"
  register: operator_lock_keys
  become: "{{ ai_lab_become }}"
  failed_when: not operator_lock_keys.stat.exists or operator_lock_keys.stat.size == 0

- name: Deny SSH for the initial account
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/20-operator-lock.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      # Managed by ai-lab-infrastructure (operator_lock). Remove this file to allow the account again.
      DenyUsers {{ operator_initial_account }}
  notify: Reload ssh
  become: "{{ ai_lab_become }}"
