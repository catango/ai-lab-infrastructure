# Variables for every profile. Tool membership comes from toolchain/manifest.toml, not from here.
repo_root: "{{ playbook_dir | dirname }}"
toolchain_engine: "{{ repo_root }}/scripts/toolchain"
toolchain_prefix: /opt/ai-lab
toolchain_profile: lab

# Host architecture (Ansible fact) to the manifest's architecture names.
arch_map:
  x86_64: amd64
  aarch64: arm64

# become only when not already root (the CI container runs as root).
ai_lab_become: "{{ ansible_facts['user_id'] != 'root' }}"

# Preflight expectations (overridable with -e for the negative tests).
# The lab profile (ADR-012, ADR-005): the AI lab, Debian 13 on x86-64. `builder` was its CR-2 name.
lab_expected_os: Debian
lab_expected_major: "13"
lab_expected_arch: x86_64

# The lab profile changes the machine, so a real run needs the explicit apply variable; --check always works (dry run by default).
lab_apply: false

# The operator profile (CR-57, ADR-012): Debian 13, x86-64, the operator machine. A real run needs the explicit apply variable (a dry
# run is the default); the names of the two managed accounts are passed with -e operator_user and -e operator_admin_user.
operator_apply: false
operator_expected_os: Debian
operator_expected_major: "13"
operator_expected_arch: x86_64

# Used only by the roles of the CR-18 Ubuntu profile that no profile applies any more (operator_firewall, operator_lock, operator_sudo,
# operator_system, operator_ssh); plan PR 7 deletes them with these lines.
# A role name, not a person: the account the approver logs in with and that holds sudo (with a password).
operator_user_name: operator
# Root-owned public keys for the operator login, provided by the approver or by cloud-init. Never in the repository.
operator_authorized_keys_file: /etc/operator/authorized_keys
operator_firewall_enabled: true
operator_firewall_revert_seconds: 300
# Local execution only: nothing in this repository connects to another host (CLAUDE.md).
