# Legacy playbook for workspace/restore.sh, which applies it until plan PR 7 removes both (CR-57 design O-19, PA-26).
# The `builder` profile is now the lab profile (ansible/lab.yml). This file applies only the toolchain to a workspace: no release
# check, no SSH hardening, no managed settings. It is not a way to set up an AI lab: use ansible/lab.yml for that.
- name: Apply the toolchain of the lab profile to a workspace (legacy)
  hosts: all
  connection: local
  gather_facts: true
  vars:
    toolchain_profile: lab
  pre_tasks:
    - name: Preflight, the workspace is a Debian 13 x86-64 host
      tags: [preflight]
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == lab_expected_os
          - ansible_facts['distribution_major_version'] == lab_expected_major
          - ansible_facts['architecture'] == lab_expected_arch
        quiet: true
        fail_msg: >-
          builder profile requires {{ lab_expected_os }} {{ lab_expected_major }} on {{ lab_expected_arch }}
          (found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}
          on {{ ansible_facts['architecture'] }})
  roles:
    - apt_base
    - toolchain
    - python_tools
    - shell_env
    - verify
