# Toolchain manifest (CR-2, ADR-005): the single source of truth for tools, versions, sources, and checksums.
# Every download has an artifact with a SHA-256 checksum for each architecture of config/project.yaml (amd64 only; CR-57 PA-30). Changes are toolchain PRs (ADR-003).
# Profiles: `lab` (the gate tools of the AI lab and of CI) and `operator`. The operator profile takes manifest membership for Python 3
# and git only (CR-57 O-15, OC-6): it installs no gate tools. What else the operator machine needs from the Debian archive (unattended-upgrades) is installed by a shared Ansible role.
# Apt tools use a minimum version and rely on the signed archive (design section 9, decision 1).

schema_version = 1

# ---- downloads (release artifacts)

# GitHub CLI. Checksums: upstream gh_2.104.0_checksums.txt and the GitHub release asset digest agree.
[tools.gh]
version     = "2.104.0"
profiles    = ["lab"]
source      = "download"
format      = "tar.gz"
strip       = 1
binaries    = ["bin/gh"]
smoke       = ["gh", "--version"]
smoke_match = "2.104.0"
max_bytes   = 104857600

[tools.gh.artifacts.amd64]
url    = "https://github.com/cli/cli/releases/download/v2.104.0/gh_2.104.0_linux_amd64.tar.gz"
sha256 = "98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e"

# yq (mikefarah). The upstream checksums file is signed (sigstore bundle, verified with cosign); the release asset digest agrees.
[tools.yq]
version     = "4.54.3"
profiles    = ["lab"]
source      = "download"
format      = "binary"
binaries    = ["yq"]
smoke       = ["yq", "--version"]
smoke_match = "4.54.3"
max_bytes   = 104857600

[tools.yq.artifacts.amd64]
url    = "https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64"
sha256 = "129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973"

# ripgrep, static musl builds. Per-artifact upstream .sha256 files and the release asset digests agree.
[tools.ripgrep]
version     = "15.2.0"
profiles    = ["lab"]
source      = "download"
format      = "tar.gz"
strip       = 1
binaries    = ["rg"]
smoke       = ["rg", "--version"]
smoke_match = "15.2.0"
max_bytes   = 104857600

[tools.ripgrep.artifacts.amd64]
url    = "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz"
sha256 = "33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"

# fd, static musl builds, installed under the name fd (the Debian package installs fdfind). Upstream publishes no checksums: the release asset digest and a local download hash agree.
[tools.fd]
version     = "10.5.2"
profiles    = ["lab"]
source      = "download"
format      = "tar.gz"
strip       = 1
binaries    = ["fd"]
smoke       = ["fd", "--version"]
smoke_match = "10.5.2"
max_bytes   = 104857600

[tools.fd.artifacts.amd64]
url    = "https://github.com/sharkdp/fd/releases/download/v10.5.2/fd-v10.5.2-x86_64-unknown-linux-musl.tar.gz"
sha256 = "7e2d07fa2b8807642aaec67b7e2972a9fbe4db26fcb340a7372392db42b26694"

# ShellCheck. Upstream publishes no checksums: the release asset digest and a local download hash agree.
[tools.shellcheck]
version     = "0.11.0"
profiles    = ["lab"]
source      = "download"
format      = "tar.xz"
strip       = 1
binaries    = ["shellcheck"]
smoke       = ["shellcheck", "--version"]
smoke_match = "0.11.0"
max_bytes   = 104857600

[tools.shellcheck.artifacts.amd64]
url    = "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
sha256 = "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

# actionlint. Upstream actionlint_1.7.12_checksums.txt and the release asset digest agree.
[tools.actionlint]
version     = "1.7.12"
profiles    = ["lab"]
source      = "download"
format      = "tar.gz"
binaries    = ["actionlint"]
smoke       = ["actionlint", "-version"]
smoke_match = "1.7.12"
max_bytes   = 104857600

[tools.actionlint.artifacts.amd64]
url    = "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
sha256 = "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

# ---- pip (hash-locked: toolchain/python/builder.lock, installed with --require-hashes into <prefix>/venv)

[tools.yamllint]
profiles    = ["lab"]
source      = "pip"
lockfile    = "toolchain/python/builder.lock"
binaries    = ["yamllint"]
smoke       = ["yamllint", "--version"]
smoke_match = "1.38.0"

[tools.pymarkdownlnt]
profiles    = ["lab"]
source      = "pip"
lockfile    = "toolchain/python/builder.lock"
binaries    = ["pymarkdown"]
smoke       = ["pymarkdown", "version"]
smoke_match = "0.9.42"

# ---- apt (signed distribution archive; installed by Ansible, checked by verify)

# Python 3 (3.13 on Debian 13; pymarkdownlnt needs 3.11 or newer).
[tools.python3]
version_min = "3.11"
profiles    = ["lab", "operator"]
source      = "apt"
package     = "python3"
smoke       = ["python3", "--version"]

# Needed to create the tool virtual environment.
# Needed by Ansible's apt module on Debian and Ubuntu.
[tools.python3-apt]
version_min = "2.6"
profiles    = ["lab"]
source      = "apt"
package     = "python3-apt"
smoke       = ["python3", "-c", "import apt"]

[tools.python3-venv]
version_min = "3.11"
profiles    = ["lab"]
source      = "apt"
package     = "python3-venv"
smoke       = ["python3", "-c", "import venv"]

# Bootstrapped from the archive by hand before any profile can be applied.
[tools.ansible-core]
version_min = "2.14"
profiles    = ["lab"]
source      = "apt"
package     = "ansible-core"
smoke       = ["ansible", "--version"]

[tools.git]
version_min = "1:2.39"
profiles    = ["lab", "operator"]
source      = "apt"
package     = "git"
smoke       = ["git", "--version"]

[tools.curl]
version_min = "7.88"
profiles    = ["lab"]
source      = "apt"
package     = "curl"
smoke       = ["curl", "--version"]

[tools.ca-certificates]
version_min = "20230311"
profiles    = ["lab"]
source      = "apt"
package     = "ca-certificates"
smoke       = ["test", "-s", "/etc/ssl/certs/ca-certificates.crt"]

[tools.tmux]
version_min = "3.3"
profiles    = ["lab"]
source      = "apt"
package     = "tmux"
smoke       = ["tmux", "-V"]

# jq from the archive (1.7.1 on both target releases).
[tools.jq]
version_min = "1.6"
profiles    = ["lab"]
source      = "apt"
package     = "jq"
smoke       = ["jq", "--version"]
