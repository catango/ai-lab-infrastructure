# Operator machine profiles (ADR-011, CR-18 design section 3.3). No identifiers: no names, addresses, or accounts.
# Architecture, OS, and limits only. The tests and the CI job `operator-limits` size their limits from the smallest values.
# Entries are filled from `facts` output; a missing key means "not measured yet".

[machines.platform_operator]
arch = "x86-64"
os = "ubuntu-24.04-minimal"
# CI test limits, not a measurement: the floor the operator scripts must run within, so the job `operator-limits` has a limit to apply.
# They replace the limits of the machine entry removed in CR-57 PR 1 until `facts --apply` measures this machine.
memory_mb = 1024
cpu_threads = 1
