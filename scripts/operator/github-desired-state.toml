# Desired GitHub configuration of the two platform repositories (docs/operations/github-setup.md, Parts 3 to 7 and 9).
# Read by scripts/operator/github-setup. No logins and no identifiers: the owner and the collaborator are given on the command
# line. A key that github-setup does not manage is never touched. Dependabot grouped updates, discussions, sponsorships, LFS in
# archives, and the chat integration have no documented REST setting here and stay manual.
# No environment is declared: github-setup accepts only deferred entries here, lists them, and never changes an environment.
schema_version = 1

[repositories.ai-lab-infrastructure]
is_template = false

[repositories.ai-software-template]
is_template = true

# PATCH /repos/{owner}/{repo} (Part 4)
[settings]
has_issues = true
has_projects = false
has_wiki = false
allow_merge_commit = false
allow_squash_merge = true
allow_rebase_merge = false
allow_auto_merge = false
allow_update_branch = true
delete_branch_on_merge = true
squash_merge_commit_title = "PR_TITLE"
squash_merge_commit_message = "PR_BODY"

# Part 6
[security]
secret_scanning = "enabled"
secret_scanning_push_protection = "enabled"
vulnerability_alerts = true
automated_security_fixes = true
private_vulnerability_reporting = true

# Part 5
[actions]
enabled = true
allowed_actions = "selected"
sha_pinning_required = true
github_owned_allowed = true
verified_allowed = false
patterns_allowed = []
default_workflow_permissions = "read"
can_approve_pull_request_reviews = false
approval_policy = "all_external_contributors"
artifact_log_retention_days = 30

# Part 9. A personal-account repository has one collaborator level (push); the invitation still has to be accepted by the account.
[collaborator]
invite = true

# Part 7.1. Rule types that are not listed here (for example required status checks) are kept as they are.
[[rulesets]]
name = "main-protection"
target = "branch"
enforcement = "active"
include = ["~DEFAULT_BRANCH"]
exclude = []
bypass_actors = []

[[rulesets.rules]]
type = "deletion"

[[rulesets.rules]]
type = "required_linear_history"

[[rulesets.rules]]
type = "non_fast_forward"

[[rulesets.rules]]
type = "pull_request"
required_approving_review_count = 1
dismiss_stale_reviews_on_push = true
require_code_owner_review = false
require_last_push_approval = true
required_review_thread_resolution = true
allowed_merge_methods = ["squash"]

# Part 7.2. The bypass actor is the Repository admin role (id 5 as GitHub reports it for rulesets created in the web interface;
# the audit compares it with the existing ruleset, so a wrong id shows up as a difference before anything is changed).
[[rulesets]]
name = "release-tags"
target = "tag"
enforcement = "active"
include = ["refs/tags/v*"]
exclude = []

[[rulesets.bypass_actors]]
actor_type = "RepositoryRole"
actor_id = 5
bypass_mode = "always"

[[rulesets.rules]]
type = "creation"

[[rulesets.rules]]
type = "update"
update_allows_fetch_and_merge = false

[[rulesets.rules]]
type = "deletion"

[[rulesets.rules]]
type = "non_fast_forward"
