# This platform's preset for the template (ADR-008 decision 14; CR-57 plan PR 10): the values and the two files that
# `initialize-project --config` seeds into a generated repository. Read by tests/ci/test_preset.py; nothing else reads it yet.
#
# Only what this repository can state today is here. The schema of `initialize-project --config` is fixed by the template's own change
# request (CR-39, names are proposals there), and the template has no built files yet (CR-57 design O-13, U-9). The remaining values
# the preset must carry then (identities with `approver_id`, `design_repos`, architectures, runner labels, `operator_paths`, visibility,
# post-init actions) are not guessed here: they are filled in by the preset follow-up that the template CR names.
schema_version: 1
platform:
  # The platform repository that the qualified record references of docs/PLATFORM.md name (`<owner>/<repository>:ADR-<n>`).
  # The approver renames the repository after CR-57 PR 10; the follow-up change PR (plan row C, I-12) updates `repository` here and
  # `project.name` in config/project.yaml, and the qualified references in docs/PLATFORM.md (tests/ci/test_preset.py fails until all agree).
  owner: catango
  repository: ai-lab-infrastructure
seeded_files:
  platform_md: docs/PLATFORM.md
  deny_platform: .claude/deny.platform.txt
