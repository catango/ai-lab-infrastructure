name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder toolchain (checksum-verified, hash-locked) provides every linter in a temporary prefix.
      - name: Install the builder toolchain
        shell: bash
        run: |
          python3 -I scripts/toolchain install --profile builder --prefix "$RUNNER_TEMP/toolchain"
          echo "$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_PATH"

      # Ansible is the one bootstrap tool that comes from the distribution archive (design 3.5).
      - name: Install ansible-core for the ansible check (package archive, only when missing)
        shell: bash
        run: |
          if ! command -v ansible-playbook >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends ansible-core
          fi

      - name: Quality gate
        shell: bash
        run: ./scripts/quality-gate.sh --strict

  # The operator tests again, under the memory and CPU limits of the smallest operator machine (CR-18 acceptance S-10).
  # The limits are read from scripts/operator/machine-profiles.toml. Needs only the runner's Python and git.
  operator-limits:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Operator tests under the strictest machine profile
        shell: bash
        run: bash tests/operator/limited.sh

  toolchain:
    name: toolchain-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs every builder tool for this architecture, runs each smoke command and compares the
      # version, re-downloads every artifact to compare checksums, and installs again to prove it is
      # idempotent (no change, no download).
      - name: Install, verify, and re-run
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          prefix="$RUNNER_TEMP/toolchain"
          python3 -I scripts/toolchain install --profile builder --prefix "$prefix" --arch "$ARCH"
          python3 -I scripts/toolchain verify --profile builder --prefix "$prefix" --arch "$ARCH" --download --skip-apt | tee "$RUNNER_TEMP/verify.txt"
          python3 -I scripts/toolchain install --profile builder --prefix "$prefix" --arch "$ARCH" | tee "$RUNNER_TEMP/second-run.txt"
          grep -qx 'changed=0' "$RUNNER_TEMP/second-run.txt"

      - name: Job summary
        if: always()
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "### toolchain-$ARCH"
            echo
            echo '~~~~text'
            cat "$RUNNER_TEMP/verify.txt" 2>/dev/null || echo "no verification output (an earlier step failed)"
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  # Applies the whole builder profile in a pinned Debian 13 container (as root, so no become), twice,
  # to prove it converges and is idempotent, then runs the engine's verification.
  builder-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What workspace/restore.sh does first: Ansible must exist before it can apply a profile.
      - name: Bootstrap Ansible from the Debian archive
        shell: bash
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends ansible-core python3-apt ca-certificates

      - name: Apply the builder profile
        shell: bash
        run: ansible-playbook -i ansible/inventory/localhost.yml ansible/builder.yml | tee "$RUNNER_TEMP/first-apply.txt"

      - name: Apply it again (must change nothing)
        shell: bash
        run: |
          ansible-playbook -i ansible/inventory/localhost.yml ansible/builder.yml | tee "$RUNNER_TEMP/second-apply.txt"
          grep -Eq 'changed=0 +unreachable=0 +failed=0' "$RUNNER_TEMP/second-apply.txt"

      - name: Verify the toolchain
        shell: bash
        run: python3 -I scripts/toolchain verify --profile builder --prefix /opt/ai-lab | tee "$RUNNER_TEMP/verify.txt"

      # The opt-in role: writes once, is idempotent, and refuses to replace a file it did not write.
      - name: Opt-in role test
        shell: bash
        env:
          AI_LAB_ALLOW_SYSTEM_CHANGES: "1"
        run: tests/ansible/opt-in-role-test.sh

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### builder-profile"
            echo
            echo '~~~~text'
            echo "first apply:"
            grep -E 'workspace +:' "$RUNNER_TEMP/first-apply.txt" 2>/dev/null || echo "  (no recap)"
            echo "second apply (must show changed=0):"
            grep -E 'workspace +:' "$RUNNER_TEMP/second-apply.txt" 2>/dev/null || echo "  (no recap)"
            echo
            cat "$RUNNER_TEMP/verify.txt" 2>/dev/null || echo "no verification output (an earlier step failed)"
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"
