name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full quality gate on the head (renamed from quality-gate: that name is now the aggregate below).
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The lab toolchain (checksum-verified, hash-locked) provides every linter in a temporary prefix.
      - name: Install the lab toolchain
        shell: bash
        run: |
          python3 -I scripts/toolchain install --profile lab --prefix "$RUNNER_TEMP/toolchain"
          echo "$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_PATH"

      # Ansible is the one bootstrap tool that comes from the distribution archive (design 3.5).
      - name: Install ansible-core for the ansible check (package archive, only when missing)
        shell: bash
        run: |
          if ! command -v ansible-playbook >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends ansible-core
          fi

      - name: Quality gate
        shell: bash
        run: ./scripts/quality-gate.sh --strict

  # The operator half of the PA-28 job (CR-57 PA-A14, PA-A18, PA-A21, PA-A26, PA-A27, PA-A29, PA-A30; design C-4, C-5): the operator
  # configuration in a pinned Debian 13 container (as root, so no become) with two accounts and one key each, in a disposable clone whose
  # local bare origin has main at the head of the pull request and an unpushed local v* test tag on that commit, so the release check of
  # the playbook runs for real and has no bypass. It is a second job and not more steps of host-profiles because the lab profile and the
  # operator profile own the same sshd drop-in and cannot share one machine; both halves use the same image, the same accounts-and-keys
  # fixtures (tests/ansible/pa28-common.sh), and the same steps. The refusals, the first run, the second run (zero changes), the second
  # project, the dry run (the tree hash is unchanged), and the operator check as the operator user (OC-8 and OC-12 shown) are steps of
  # tests/ansible/pa28-operator.sh. The container has no systemd and no sudo: a real sshd restart after a second login, `sshd -T` of a
  # running daemon, the unattended-upgrade units, and that the operator user cannot sudo on a real machine are the approver check PA-A33.
  operator-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    env:
      AI_LAB_ALLOW_SYSTEM_CHANGES: "1"
    steps:
      # What a fresh operator machine has before the operator configuration: Ansible, git, and an installed sshd (it is reached over SSH). git
      # comes first: without it the checkout action downloads an archive and the workspace is not a repository.
      - name: Bootstrap Ansible, git, and sshd from the Debian archive
        shell: bash
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends ansible-core python3-apt ca-certificates git openssh-server

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Accounts, keys, and the disposable clones with a local bare origin and unpushed v* test tags
        shell: bash
        run: tests/ansible/pa28-operator.sh prepare "$GITHUB_WORKSPACE"

      - name: Refusals change nothing (untagged tree, tag outside origin/main, wrong user, project list, key rules, sshd settings)
        shell: bash
        run: tests/ansible/pa28-operator.sh refusals

      - name: The sshd step is refused without the confirmed second login
        shell: bash
        run: tests/ansible/pa28-operator.sh unconfirmed

      - name: Apply the operator profile (first run)
        shell: bash
        run: tests/ansible/pa28-operator.sh first-run

      - name: Apply it again (second run, must change nothing)
        shell: bash
        run: tests/ansible/pa28-operator.sh second-run

      - name: A second project is installed beside the first, then nothing changes (PA-42, PA-A30)
        shell: bash
        run: tests/ansible/pa28-operator.sh second-project

      - name: Dry run (the tree hash must not change)
        shell: bash
        run: tests/ansible/pa28-operator.sh dry-run

      - name: Verify the operator toolchain (Python 3 and git only)
        shell: bash
        run: python3 -I scripts/toolchain verify --profile operator --prefix /opt/ai-lab | tee "$RUNNER_TEMP/verify.txt"

      - name: Installed tools, write attempts as the operator user, no sudo, unattended updates, and the sshd settings in force
        shell: bash
        run: tests/ansible/pa28-operator.sh verify

      - name: Operator check as the operator user, one fixture per failure, and the run lock (PA-A14, PA-A26, PA-A30)
        shell: bash
        run: tests/ansible/pa28-operator.sh operator-check

      - name: The operator configuration takes the operator user out of the sudo group (OC-8)
        shell: bash
        run: tests/ansible/pa28-operator.sh unsudo

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### operator-profile"
            echo
            echo '~~~~text'
            for step in unconfirmed first-apply second-apply second-project second-project-again dry-run; do
              echo "$step:"
              grep -E 'workspace +:' "/var/tmp/pa28/$step.txt" 2>/dev/null || echo "  (no recap)"
            done
            echo
            cat "$RUNNER_TEMP/verify.txt" 2>/dev/null || echo "no verification output (an earlier step failed)"
            echo
            echo "operator check:"
            cat /var/tmp/pa28/operator-check.txt 2>/dev/null || echo "  (no output)"
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  toolchain:
    name: toolchain-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs every lab tool for this architecture, runs each smoke command and compares the
      # version, re-downloads every artifact to compare checksums, and installs again to prove it is
      # idempotent (no change, no download).
      - name: Install, verify, and re-run
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          prefix="$RUNNER_TEMP/toolchain"
          python3 -I scripts/toolchain install --profile lab --prefix "$prefix" --arch "$ARCH"
          python3 -I scripts/toolchain verify --profile lab --prefix "$prefix" --arch "$ARCH" --download --skip-apt | tee "$RUNNER_TEMP/verify.txt"
          python3 -I scripts/toolchain install --profile lab --prefix "$prefix" --arch "$ARCH" | tee "$RUNNER_TEMP/second-run.txt"
          grep -qx 'changed=0' "$RUNNER_TEMP/second-run.txt"

      - name: Job summary
        if: always()
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "### toolchain-$ARCH"
            echo
            echo '~~~~text'
            cat "$RUNNER_TEMP/verify.txt" 2>/dev/null || echo "no verification output (an earlier step failed)"
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  # The PA-28 job (CR-57 PA-A11, PA-A16, PA-A18, PA-A29; design C-4, C-5): lab setup in a pinned Debian 13 container (as root, so no
  # become) with two accounts and one key each. It runs in a disposable clone whose local bare origin has main at the head of the
  # pull request and an unpushed local v* test tag on that commit, so the release check of the playbook runs for real and has no
  # bypass; an untagged tree is refused. The refusal fixtures, the first run, the second run (zero changes), and the dry run (the
  # tree hash is unchanged) are steps of tests/ansible/pa28-lab.sh. The token step fixtures and the
  # lab check are steps of it (plan PR 3); the operator half of the PA-28 job is the job operator-profile (plan PR 4).
  # The container has no systemd: a real sshd restart after a second login, `sshd -T` of a running daemon, and the
  # unattended-upgrade units are the approver check PA-A33.
  host-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    env:
      AI_LAB_ALLOW_SYSTEM_CHANGES: "1"
    steps:
      # What a fresh lab has before lab setup: Ansible, git, and an installed sshd (it is reached over SSH). git comes first:
      # without it the checkout action downloads an archive and the workspace is not a repository.
      - name: Bootstrap Ansible, git, sshd, and jq from the Debian archive
        shell: bash
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends ansible-core python3-apt ca-certificates git openssh-server jq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Accounts, keys, and the disposable clones with a local bare origin and an unpushed v* test tag
        shell: bash
        run: tests/ansible/pa28-lab.sh prepare "$GITHUB_WORKSPACE"

      - name: Refusals change nothing (untagged tree, tag outside origin/main, key rules, sshd settings)
        shell: bash
        run: tests/ansible/pa28-lab.sh refusals

      - name: The sshd step is refused without the confirmed second login
        shell: bash
        run: tests/ansible/pa28-lab.sh unconfirmed

      - name: Apply the lab profile (first run)
        shell: bash
        run: tests/ansible/pa28-lab.sh first-run

      - name: Apply it again (second run, must change nothing)
        shell: bash
        run: tests/ansible/pa28-lab.sh second-run

      - name: Dry run (the tree hash must not change)
        shell: bash
        run: tests/ansible/pa28-lab.sh dry-run

      - name: Verify the toolchain
        shell: bash
        run: python3 -I scripts/toolchain verify --profile lab --prefix /opt/ai-lab | tee "$RUNNER_TEMP/verify.txt"

      - name: Managed files, write attempts as the AI user, and the sshd settings in force
        shell: bash
        run: tests/ansible/pa28-lab.sh verify

      - name: Managed settings and the managed instruction file are merged, never replaced
        shell: bash
        run: tests/ansible/pa28-lab.sh merge

      # The fixtures of tests/lab run against the files lab setup installed, as the AI user. The first AC1-7 timing and the lab check
      # on a real lab are not taken here: they come from the first real lab setup (CR-57 C-3, O-26).
      - name: Token step fixtures against the installed, root-owned step (PA-A8, PA-A25, LC-14)
        shell: bash
        run: tests/ansible/pa28-lab.sh token-step

      - name: Lab check as the AI user, one fixture per failure, and the pre-disposal mode (PA-A8, PA-A13, PA-A18, PA-A26, PA-A31, PA-A32)
        shell: bash
        run: tests/ansible/pa28-lab.sh lab-check

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### host-profiles"
            echo
            echo '~~~~text'
            for step in unconfirmed first-apply second-apply dry-run; do
              echo "$step:"
              grep -E 'workspace +:' "/var/tmp/pa28/$step.txt" 2>/dev/null || echo "  (no recap)"
            done
            echo
            cat "$RUNNER_TEMP/verify.txt" 2>/dev/null || echo "no verification output (an earlier step failed)"
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  # The one required check of this workflow (ADR-009 decision 1, design section 3). It needs every other job, always runs, and
  # fails unless each needed job is `success`: a skipped job reports success to the ruleset, so `skipped` and `cancelled` fail
  # here too. A matrix job counts once (its combined result). It checks out nothing and runs no repository code.
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [gate, operator-profile, toolchain, host-profiles]
    if: always()
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import sys

          try:
              needs = json.loads(os.environ["NEEDS"])
          except (KeyError, ValueError):
              needs = None
          if not isinstance(needs, dict) or not needs:
              print("quality-gate: the needs context is empty or unreadable")
              sys.exit(1)
          rows = sorted((name, str(job.get("result", "")) if isinstance(job, dict) else "") for name, job in needs.items())
          lines = [f"{name}: {result or 'unknown'}" for name, result in rows]
          print("\n".join(lines))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("### quality-gate\n\n| Job | Result |\n|---|---|\n")
                  handle.write("".join(f"| {name} | {result or 'unknown'} |\n" for name, result in rows))
          bad = [name for name, result in rows if result != "success"]
          if bad:
              print("quality-gate: not successful: " + ", ".join(bad))
              sys.exit(1)
          PY
