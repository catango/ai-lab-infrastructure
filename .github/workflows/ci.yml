name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full quality gate on the head (renamed from quality-gate: that name is now the aggregate below).
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder toolchain (checksum-verified, hash-locked) provides every linter in a temporary prefix.
      - name: Install the builder toolchain
        shell: bash
        run: |
          python3 -I scripts/toolchain install --profile builder --prefix "$RUNNER_TEMP/toolchain"
          echo "$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_PATH"

      # Ansible is the one bootstrap tool that comes from the distribution archive (design 3.5).
      - name: Install ansible-core for the ansible check (package archive, only when missing)
        shell: bash
        run: |
          if ! command -v ansible-playbook >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends ansible-core
          fi

      - name: Quality gate
        shell: bash
        run: ./scripts/quality-gate.sh --strict

  # Applies the operator profile with scripts/operator/setup in a pinned Ubuntu 24.04 container, as root (so without sudo), twice,
  # to prove that it converges and is idempotent (CR-18 acceptance P-1, P-2, P-3, P-5, P-8). The container has no systemd and no
  # network namespace rights, so the firewall and service tasks are skipped there; they are checked by the approver (P-6).
  # setup refuses to run outside a release tag, so the job makes a throw-away copy of the checkout that is tagged and marked as
  # origin/main. Nothing is pushed and no tag leaves the job.
  operator-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
    steps:
      # What a minimal Ubuntu image lacks before the checkout and the release check can run (design VO-15).
      - name: Bootstrap git, python3, and certificates
        shell: bash
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends git python3 ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make a tagged throw-away copy for the release check
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/release"
          git -C "$RUNNER_TEMP/release" tag v0.0.0
          git -C "$RUNNER_TEMP/release" update-ref refs/remotes/origin/main HEAD

      - name: setup refuses to run outside a release tag (P-2)
        shell: bash
        run: |
          rc=0
          "$GITHUB_WORKSPACE/scripts/operator/setup" --apply || rc=$?
          test "$rc" -eq 1
          ! command -v ansible-playbook

      - name: A dry run installs nothing (P-1)
        shell: bash
        run: |
          "$RUNNER_TEMP/release/scripts/operator/setup" | tee "$RUNNER_TEMP/dry-run.txt"
          grep -q 'apt-get install -y ansible-core' "$RUNNER_TEMP/dry-run.txt"
          ! command -v ansible-playbook

      - name: Apply the operator profile
        shell: bash
        run: '"$RUNNER_TEMP/release/scripts/operator/setup" --apply | tee "$RUNNER_TEMP/first-apply.txt"'

      - name: Apply it again (must change nothing, P-5)
        shell: bash
        run: |
          "$RUNNER_TEMP/release/scripts/operator/setup" --apply | tee "$RUNNER_TEMP/second-apply.txt"
          grep -Eq 'changed=0 +unreachable=0 +failed=0' "$RUNNER_TEMP/second-apply.txt"

      - name: A real playbook run without the apply variable is refused (P-3)
        shell: bash
        run: |
          rc=0
          (cd "$RUNNER_TEMP/release" && ansible-playbook -i ansible/inventory/localhost.yml ansible/operator.yml) > "$RUNNER_TEMP/refused.txt" 2>&1 || rc=$?
          test "$rc" -ne 0
          grep -q operator_apply "$RUNNER_TEMP/refused.txt"

      - name: A dry run after the apply changes nothing and passes
        shell: bash
        run: '"$RUNNER_TEMP/release/scripts/operator/setup" | tee "$RUNNER_TEMP/check.txt"'

      - name: Verify the operator toolchain
        shell: bash
        run: python3 -I "$RUNNER_TEMP/release/scripts/toolchain" verify --profile operator --prefix /opt/ai-lab | tee "$RUNNER_TEMP/verify.txt"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### operator-profile"
            echo
            echo '~~~~text'
            echo "first apply:"
            grep -E 'localhost +:|workspace +:' "$RUNNER_TEMP/first-apply.txt" 2>/dev/null || echo "  (no recap)"
            echo "second apply (must show changed=0):"
            grep -E 'localhost +:|workspace +:' "$RUNNER_TEMP/second-apply.txt" 2>/dev/null || echo "  (no recap)"
            echo
            cat "$RUNNER_TEMP/verify.txt" 2>/dev/null || echo "no verification output (an earlier step failed)"
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  toolchain:
    name: toolchain-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs every builder tool for this architecture, runs each smoke command and compares the
      # version, re-downloads every artifact to compare checksums, and installs again to prove it is
      # idempotent (no change, no download).
      - name: Install, verify, and re-run
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          prefix="$RUNNER_TEMP/toolchain"
          python3 -I scripts/toolchain install --profile builder --prefix "$prefix" --arch "$ARCH"
          python3 -I scripts/toolchain verify --profile builder --prefix "$prefix" --arch "$ARCH" --download --skip-apt | tee "$RUNNER_TEMP/verify.txt"
          python3 -I scripts/toolchain install --profile builder --prefix "$prefix" --arch "$ARCH" | tee "$RUNNER_TEMP/second-run.txt"
          grep -qx 'changed=0' "$RUNNER_TEMP/second-run.txt"

      - name: Job summary
        if: always()
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "### toolchain-$ARCH"
            echo
            echo '~~~~text'
            cat "$RUNNER_TEMP/verify.txt" 2>/dev/null || echo "no verification output (an earlier step failed)"
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  # The PA-28 job (CR-57 PA-A11, PA-A16, PA-A18, PA-A29; design C-4, C-5): lab setup in a pinned Debian 13 container (as root, so no
  # become) with two accounts and one key each. It runs in a disposable clone whose local bare origin has main at the head of the
  # pull request and an unpushed local v* test tag on that commit, so the release check of the playbook runs for real and has no
  # bypass; an untagged tree is refused. The refusal fixtures, the first run, the second run (zero changes), and the dry run (the
  # tree hash is unchanged) are steps of tests/ansible/pa28-lab.sh. This job replaces builder-profile; the operator profile stays
  # in operator-profile until plan PR 4. The token step fixtures and both checks join this job in plan PR 3 and PR 4.
  # The container has no systemd: a real sshd restart after a second login, `sshd -T` of a running daemon, and the
  # unattended-upgrade units are the approver check PA-A33.
  host-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    env:
      AI_LAB_ALLOW_SYSTEM_CHANGES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # What a fresh lab VM has before lab setup: Ansible, git, and an installed sshd (it is reached over SSH).
      - name: Bootstrap Ansible, git, sshd, and jq from the Debian archive
        shell: bash
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends ansible-core python3-apt ca-certificates git openssh-server jq

      - name: Accounts, keys, and the disposable clones with a local bare origin and an unpushed v* test tag
        shell: bash
        run: tests/ansible/pa28-lab.sh prepare "$GITHUB_WORKSPACE"

      - name: Refusals change nothing (untagged tree, tag outside origin/main, key rules, sshd settings)
        shell: bash
        run: tests/ansible/pa28-lab.sh refusals

      - name: The sshd step is refused without the confirmed second login
        shell: bash
        run: tests/ansible/pa28-lab.sh unconfirmed

      - name: Apply the lab profile (first run)
        shell: bash
        run: tests/ansible/pa28-lab.sh first-run

      - name: Apply it again (second run, must change nothing)
        shell: bash
        run: tests/ansible/pa28-lab.sh second-run

      - name: Dry run (the tree hash must not change)
        shell: bash
        run: tests/ansible/pa28-lab.sh dry-run

      # The alias of the CR-2 name: the engine still accepts `builder` and means `lab` (plan PR 7 removes it).
      - name: Verify the toolchain
        shell: bash
        run: python3 -I scripts/toolchain verify --profile builder --prefix /opt/ai-lab | tee "$RUNNER_TEMP/verify.txt"

      - name: Managed files, write attempts as the AI user, and the sshd settings in force
        shell: bash
        run: tests/ansible/pa28-lab.sh verify

      - name: Managed settings and the managed instruction file are merged, never replaced
        shell: bash
        run: tests/ansible/pa28-lab.sh merge

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### host-profiles"
            echo
            echo '~~~~text'
            for step in unconfirmed first-apply second-apply dry-run; do
              echo "$step:"
              grep -E 'workspace +:' "/var/tmp/pa28/$step.txt" 2>/dev/null || echo "  (no recap)"
            done
            echo
            cat "$RUNNER_TEMP/verify.txt" 2>/dev/null || echo "no verification output (an earlier step failed)"
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  # The one required check of this workflow (ADR-009 decision 1, design section 3). It needs every other job, always runs, and
  # fails unless each needed job is `success`: a skipped job reports success to the ruleset, so `skipped` and `cancelled` fail
  # here too. A matrix job counts once (its combined result). It checks out nothing and runs no repository code.
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [gate, operator-profile, toolchain, host-profiles]
    if: always()
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import sys

          try:
              needs = json.loads(os.environ["NEEDS"])
          except (KeyError, ValueError):
              needs = None
          if not isinstance(needs, dict) or not needs:
              print("quality-gate: the needs context is empty or unreadable")
              sys.exit(1)
          rows = sorted((name, str(job.get("result", "")) if isinstance(job, dict) else "") for name, job in needs.items())
          lines = [f"{name}: {result or 'unknown'}" for name, result in rows]
          print("\n".join(lines))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("### quality-gate\n\n| Job | Result |\n|---|---|\n")
                  handle.write("".join(f"| {name} | {result or 'unknown'} |\n" for name, result in rows))
          bad = [name for name, result in rows if result != "success"]
          if bad:
              print("quality-gate: not successful: " + ", ".join(bad))
              sys.exit(1)
          PY
