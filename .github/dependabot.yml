# Version updates only (CR-2 decision 9). Every update arrives as a PR on a `dependabot/` branch, which
# pr-contract treats under rule PC-7: it may change only dependency manifests, lock files, and workflow
# `uses:` pins. The approver reviews and merges every one of them; nothing is merged automatically.
version: 2
updates:
  # SHA-pinned Actions: Dependabot rewrites the commit SHA and the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The hash-locked Python tools of the builder profile (toolchain/python/builder.in and builder.lock).
  - package-ecosystem: pip
    directory: /toolchain/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
